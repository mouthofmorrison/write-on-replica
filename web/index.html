<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write On</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/editor.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/panels.css" />
    <link rel="stylesheet" href="styles/popovers.css" />
    <link rel="stylesheet" href="styles/lab.css" />
  </head>
  <body class="is-booting">
    <div id="scroll">
      <div id="page">
        <div id="underlay" aria-hidden="true"></div>
        <svg id="decor" aria-hidden="true"></svg>
        <div id="editor" contenteditable="true" autocapitalize="off"></div>
        <div id="scan" aria-hidden="true"></div>
      </div>
    </div>

    <aside id="panel" aria-label="Alternatives">
      <div class="tabs">
        <button class="tab" type="button" data-scope="word">Word</button>
        <button class="tab" type="button" data-scope="sentence">Sentence</button>
        <button class="tab" type="button" data-scope="paragraph">Paragraph</button>
      </div>
      <ol class="rows"></ol>
      <p class="hint">return adds · esc closes</p>
    </aside>

    <aside id="overflow" aria-label="Overflow">
      <h2 class="title">Overflow</h2>
      <textarea class="text" aria-label="Overflow text" autocomplete="off" autocapitalize="off"></textarea>
      <p class="hint">⌘<span class="return">↵</span> or drag into the page to use</p>
    </aside>

    <!-- The chrome. Icons are drawn to the measurements in the design spec, section 4.3;
         each viewBox has its origin at the middle of the drawing. WebKit paints an inline
         SVG from a whole pixel, so every control sits on whole pixels and any half pixel
         in a drawing's position is written into its viewBox instead. -->
    <button id="wordcount" class="control" type="button" title="Read (⌘⇧R)"></button>

    <button id="toggle-alternates" class="control chrome icon wide" type="button" aria-label="Show alternatives" aria-pressed="true">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <circle cx="-8.15" cy="-4.15" r="2.58" stroke-width="1.75" />
        <circle class="solid" cx="0" cy="-4.15" r="3.43" />
        <circle cx="8.15" cy="-4.15" r="2.58" stroke-width="1.75" />
        <path d="M-11.37 7.58H11.37" stroke-width="1.66" />
      </svg>
    </button>
    <button id="open-source" class="control chrome icon wide" type="button" aria-label="View source" data-tip="⌘U">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <path d="M-7.03 3.54V-3.64L-3.79 -.4L-.54 -3.64V3.54" />
        <path d="M5.42 -3.5V3.77M2.78 1.13L5.42 3.77L8.06 1.13" />
      </svg>
    </button>
    <button id="open-shortcuts" class="control chrome icon wide" type="button" aria-label="Keyboard shortcuts">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <g class="solid">
          <circle cx="-6.47" cy="-3" r=".79" />
          <circle cx="-2.8" cy="-3" r=".79" />
          <circle cx=".87" cy="-3" r=".79" />
          <circle cx="4.53" cy="-3" r=".79" />
          <circle cx="-6.49" cy=".49" r=".79" />
          <circle cx="-2.79" cy=".49" r=".79" />
          <circle cx=".86" cy=".49" r=".79" />
          <circle cx="3.73" cy=".49" r=".79" />
          <circle cx="6.52" cy=".49" r=".79" />
          <rect x="-4.98" y="3.25" width="10.05" height="1.73" />
        </g>
      </svg>
    </button>

    <button id="save" class="control chrome icon" type="button" aria-label="Save" data-tip="⌘S">
      <svg viewBox="-10 -10 20 20" aria-hidden="true">
        <path d="M-7.58 -7.62H3.53L7.58 -3.57V7.62H-7.58Z" />
        <path d="M-3.46 -7.62V-2.78H2.73V-7.62" />
        <path d="M-4.89 7.62V2.06H4.88V7.62" />
      </svg>
    </button>
    <button id="open" class="control chrome icon" type="button" aria-label="Open" data-tip="⌘O">
      <svg viewBox="-10.5 -10 20 20" aria-hidden="true">
        <path d="M-7.59 -7.62H-1.96L.79 -4.87H7.57V7.62H-7.59Z" />
      </svg>
    </button>

    <button id="lab" class="control chrome" type="button" aria-label="The Lab">
      <svg viewBox="0 0 46 26" aria-hidden="true">
        <rect x=".9" y=".5" width="44.4" height="25" rx="4.6" />
      </svg>
      <span>LAB</span>
    </button>
    <button id="toggle-overflow" class="control chrome icon wide" type="button" aria-label="Overflow" aria-pressed="false" data-tip="⌘⇧D">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <text class="solid" x="0" y="3.46" text-anchor="middle">XYZ</text>
      </svg>
    </button>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="formatbar" role="toolbar" aria-label="Text formatting">
      <button type="button" data-cmd="bold" title="Bold (⌘B)"><strong>B</strong></button>
      <button type="button" data-cmd="italic" title="Italic (⌘I)"><em>I</em></button>
      <button type="button" data-cmd="strikethrough" title="Strikethrough (⌘⇧X)"><s>S</s></button>
      <button type="button" data-cmd="code" title="Inline code (⌘⇧C)">&lt;/&gt;</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-cmd="link" title="Link (⌘K)">Link</button>
      <button type="button" data-cmd="blockquote" title="Block quote (⌘⇧9)">“”</button>
      <button type="button" data-cmd="codeblock" title="Code block (⌘⌥⇧C)">{}</button>
    </div>
    <div id="linkpop" role="dialog" aria-label="Edit link">
      <form>
        <input type="url" placeholder="https://…" autocomplete="off" spellcheck="false" />
        <button type="submit" class="link-apply">Apply</button>
        <button type="button" class="link-open" hidden>Open</button>
        <button type="button" class="link-unlink" hidden>Unlink</button>
      </form>
    </div>
    <div id="tooltip" role="tooltip"></div>
    <div id="menu" role="menu"></div>
    <div id="labcard" role="status">
      <p class="title"><span class="name"></span> <span class="state"></span></p>
      <p class="hint"></p>
      <div class="actions"></div>
    </div>
    <div id="labmenu" role="menu" aria-label="The Lab"></div>
    <div id="labtip" role="tooltip"></div>
    <div id="scrim"></div>
    <section id="source" role="dialog" aria-modal="true" aria-label="The piece as Markdown, and the file as saved">
      <header>
        <div class="tabs">
          <button class="tab" type="button" data-view="markdown">Markdown</button>
          <button class="tab" type="button" data-view="saved">As saved</button>
          <button class="tab" type="button" data-view="readable">Readable</button>
        </div>
        <span class="bytes"></span>
        <button class="copy" type="button">Copy</button>
      </header>
      <div class="body" tabindex="-1"></div>
    </section>
    <div id="card" role="dialog" aria-modal="true"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
